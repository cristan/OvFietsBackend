services:
  subscriber:
    build: .
    restart: unless-stopped
    logging:
      driver: local
    volumes:
      - public:/srv/public
  web:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    logging:
      driver: local
    ports:
      - "8080:80"
    volumes:
      - public:/srv/public:ro
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf

volumes:
  public:

configs:
  nginx:
    content: |
      server {
          root /srv/public;
          gzip_static always;
          gunzip on;
          gzip_vary on;
          add_header Cache-Control "no-cache";
      }
