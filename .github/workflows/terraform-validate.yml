name: tofu validate

on: push

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
      - uses: actions/cache@v5
        with:
          path: .terraform
          key: terraform-${{ hashFiles('.terraform.lock.hcl') }}
      - run: tofu init -backend=false
      - run: tofu validate
